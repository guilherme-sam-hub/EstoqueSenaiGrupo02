
# CONFIGURAÇÃO BANCO DE DADOS (H2)
# Ambiente de desenvolvimento local

# Console do H2 no navegador:
# http://localhost:8080/h2-console

# obs: Para trocarmos para outro banco, só alterarmos:
# - url
# - username
# - password
# - driver-class-name
# - dependência do banco de dados no pom.xml
spring:
  datasource:
    url: jdbc:h2:file:./data/estoque;AUTO_SERVER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console