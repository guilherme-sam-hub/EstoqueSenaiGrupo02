<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./login/login.css">
</head>
<body>
     <div class="cardPai">
        <div class="cardFilho">
            <h1>Login</h1>
            <form>
                <div class="entrada">
                    <label for="InputEmail">Email:</label>
                    <input id="inputEmail"  type="email"  placeholder="Digite o email">
                </div>

                <div class="entrada">
                    <label for="InputSenha">Senha:</label>
                    <input id="inputSenha" type="password"  placeholder="Digite a senha">
                </div>
                
                
                <button class="btnEntrar" onclick="fazerLogin()">Entrar</button>
                <button type="button" class="btnCadastrar" onclick="window.location.href='./cadastro/cadastro.html'">Cadastrar Usuário</button> 
               
            </form>
            <hr>
        </div>

       <hr>

        <footer><p>Sistema de Login de Usuários &copy; 2026 - Equipe 2 SENAI</p></footer>
    </div>

    
    <script src="./login/login.js"></script>

</body>
</html>
