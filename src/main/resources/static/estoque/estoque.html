<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <!-- Importação da fonte Inter igual ao CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./estoque.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo-estoque">
        <img src="icone-caixa-escuro.svg" alt="Ícone Estoque">
        <h1 id="ititulo-header">ESTOQUE</h1>
    </div>

    <div class="div-link">
        <nav class="links-nav">
            <a href="estoque.html" class="ativo">Estoque</a>
            <a href="../cadastro/cadastro.html">Cadastrar Usuário</a>
        </nav>
    </div>

    <div class="div-btn-sair">
        <a href="../index.html" class="btn-sair">
            <img src="icone-sair.svg" alt="Ícone Sair" style="width: 18px; height: 18px;">
            Sair
        </a>
    </div>
</header>

<!-- SECTION CADASTRO DE PRODUTO -->
<main>
    <section class="div-container">
        <div class="div-logo-cadastro-de-produto">
            <img src="icone-caixa-escuro.svg" alt="Ícone Caixa">
            <h1>Cadastro de Produto</h1>
        </div>

        <hr>

        <div class="div-cadastrando-produto">
            <div class="div-cadastrando-produto-nome">
                <label for="input-nome">Nome do Produto</label>
                <input type="text" id="input-nome" placeholder="Digite o nome do produto">
            </div>

            <div class="div-cadastrando-produto-quantidade">
                <label for="input-quantidade">Quantidade</label>
                <input type="number" id="input-quantidade" placeholder="Ex: 10">
            </div>

            <div class="div-cadastrando-produto-preco">
                <label for="input-preco">Preço (R$)</label>
                <input type="text" id="input-preco" placeholder="Ex: 29,90">
            </div>

            <div class="div-cadastrando-produto-acao">
                <span id="span-cadastrando-produto-acao">Ação</span>
                <button id="btn-cadastrar">
                    <img src="icone-salvar.svg" alt="Ícone Salvar" style="width: 16px; height: 16px; filter: brightness(0) invert(1);">
                    Cadastrar Produto
                </button>
            </div>
        </div>
    </section>

    <!-- SECTION LISTAR PRODUTOS -->
    <section class="section-lista-de-produtos">
        <div class="header-section-lista-de-produtos">
            <img src="icone-caixa-escuro.svg" alt="Ícone Lista">
            <h2>Lista de Produtos</h2>
        </div>

        <hr>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabela-produtos">
            <tr>
                <td colspan="5" class="lista-vazia">Nenhum produto cadastrado</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<!-- RODAPÉ -->
<footer class="footer">
    <p>Sistema de Cadastro de Produtos &copy; 2026 - Equipe 2 SENAI</p>
</footer>

<!-- Script de lógica do estoque -->
<script src="estoque.js"></script>
</body>
</html>
