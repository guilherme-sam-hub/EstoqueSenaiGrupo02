<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="./cadastro.css">
</head>
<body>
    <header class="cabecalho">
        <img src="../cadastro/imagens/imgTitulo.PNG" alt="Usuarios">

        <nav class="nav">
            <a href="../index.html">Tela de Login</a>
            <a href="../estoque/estoque.html">Tela de Estoque de Produtos</a>
        </nav>
    </header>

    <div class="cardInput">
        <img class="imgTitulo" src="../cadastro/imagens/imgInput.PNG" alt="">
        <hr>

        <form class="form">
            <div>
                <label for="nome">Nome</label>
                <input type="text" placeholder="Digite o nome do usuário">
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email" placeholder="Digite o e-mail do usuário">
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" placeholder="Digite a senha">
            </div>

            <button><img class="imgBtn" src="../cadastro/imagens/imgBtCad.PNG" alt="Botão Cadastrar"></button>
        </form>
    </div>

    <div class="cardLista">
        <img class="imgLista" src="../cadastro/imagens/imgLista.PNG" alt="">
        <table class="table">
            <thead> <!-- cabeçalho -->
                <tr> <!-- uma linha -->
                    <th class="colunaId" >ID</th> <!-- célula de cabeçalho -->
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>

                </tr>
            </thead>
        </table>
    </div>


    <script src="./cadastro.js"></script>
</body>
</html>
