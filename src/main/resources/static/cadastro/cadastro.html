<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <!-- Caminho absoluto para o CSS dentro da pasta cadastro -->
    <link rel="stylesheet" href="/cadastro/cadastro.css">
</head>
<body>
<header class="cabecalho">
    <!-- Caminho absoluto para a pasta imagens -->
    <img src="/cadastro/imagens/imgTitulo.PNG" alt="Usuarios">

    <nav class="nav">
        <!-- Caminhos absolutos para as outras páginas -->
        <a href="/index.html">Tela de Login</a>
        <a href="/estoque/estoque.html">Tela de Estoque de Produtos</a> <!-- Ajuste se o estoque estiver em outra pasta -->
    </nav>
</header>

<div class="cardInput">
    <img class="imgTitulo" src="/cadastro/imagens/imgInput.PNG" alt="">
    <hr>

    <form class="form" id="formCadastro">
        <div>
            <label for="nomeInput">Nome</label>
            <input name="nome" id="nomeInput" type="text" placeholder="Digite o nome do usuário" required>
        </div>

        <div>
            <label for="emailInput">E-mail</label>
            <input name="email" id="emailInput" type="email" placeholder="Digite o e-mail do usuário" required>
        </div>

        <div>
            <label for="senhaInput">Senha</label>
            <input name="senha" id="senhaInput" type="password" placeholder="Digite a senha" required>
        </div>

        <button type="submit" id="btnCadastrar">
            <img class="imgBtn" src="/cadastro/imagens/imgBtCad.PNG" alt="Botão Cadastrar">
        </button>
    </form>
</div>

<div class="cardLista">
    <img class="imgLista" src="/cadastro/imagens/imgLista.PNG" alt="">
    <table class="table">
        <thead>
        <tr class="linhaCab">
            <th class="colunaId">ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody id="listaUsuarios" class="tBody">
        <!-- O JS preenche isso aqui -->
        </tbody>
    </table>
    <hr>
</div>

<footer class="rodape">
    <p>Sistema de Cadastro de Usuários &copy; 2026 - Equipe 2 SENAI</p>
</footer>

<!-- Caminho absoluto para o JS -->
<script src="/cadastro/cadastro.js"></script>
</body>
</html>
