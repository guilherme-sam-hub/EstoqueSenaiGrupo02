<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Produtos</title>
    <link rel="stylesheet" href="./../../static/estoque/estoque.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- criando a parte do header com os links, botão de sair e título -->


    <header class="header">
        <div class="logo-estoque">
            <img src="./../../downloads/imgs/icone-caixa.svg" alt="imagem-de-caixa-de-estoque">
            <h1 id="ititulo-header">ESTOQUE</h1>
        </div>

        <div class="div-link">
            <nav class="links-nav">
                <a href="./../../templates/estoque/estoque.html" class="ativo">Estoque</a>
                <a href="#">Cadastrar Usuário</a>
            </nav>
        </div>

        <div class="div-btn-sair">
            <a href="#" class="btn-sair">
                <img src="./../../downloads/imgs/icone-sair.svg" alt="">
                Sair
            </a>
        </div>
    </header>


    <section class="section-cadastro-de-produto">
        <div class="div-container">

            <div class="div-logo-cadastro-de-produto">
                <img src="./../../downloads/imgs/icone-caixa-escuro.svg" alt="">
                <h1>Cadastro De Produto</h1>
            </div>
            <hr>
            <div class="div-cadastrando-produto">
                <div class="div-cadastrando-produto-nome">

                    <label for="inomeProduto">Nome do Produto</label>
                    <input type="text" name="nomeProduto" id="inomeProduto" placeholder="Digite o nome do produto">

                </div>
                <div class="div-cadastrando-produto-quantidade">

                    <label for="iquantidade">Quantidade</label>
                    <input type="number" name="quantidade" id="iquantidade" placeholder="Ex: 10">

                </div>
                <div class="div-cadastrando-produto-preco">

                    <label for="ipreco">Preço (R$)</label>
                    <input type="number" name="preco" id="ipreco" placeholder="Ex: 199.99">

                </div>
                <div class="div-cadastrando-produto-acao">
                    <span id="span-cadastrando-produto-acao">Ação</span>
                    <button type="button" id="btn-cadastrar">
                        <img src="./../../downloads/imgs/icone-salvar.svg" alt="">
                        cadastrar produto</button>

                    <p id="aviso-limite" class="aviso-limite escondido">
                        <span class="icone-aviso">i</span>
                        Limite máximo atingido!
                    </p>
                </div>
            </div>

        </div>
    </section>


    <section class="section-lista-de-produtos">

        <div class="header-section-lista-de-produtos">
            <!-- colocar imagem de uma prancheta-->
            <span class="img-prancheta-section-lista-de-produtos"></span>
            <h2>Lista de Produtos</h2>
        </div>

        <!--Tabela que fica escondida no HTML mas aparecerá no JS-->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produtos</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <!-- Aqui ficarão as linhas de códigos do JS para ir adicionando produtos conforme o botao de cadastrar produto for pressionado -->

            <tbody>

            </tbody>

        </table>

        <div class="lista-vazia">
            <p>Nenhum produto cadastrado </p>
        </div>

    </section>

    <hr>

    <footer class="footer">
        <div class="footer-">
            <p>Sistema de Cadastro de Produtos &copy; 2026 - Equipe 2 SENAI </p>
        </div>
    </footer>



    <!--Parte do JS externo para cadastro -->
    <script src="./../../static/estoque/estoque.js"></script>
</body>

</html>
