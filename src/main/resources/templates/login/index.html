<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/login/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cardPai">
        <div class="cardFilho">
            <h1>Login</h1>
            <form>
                <div class="entrada">
                    <label for="email">Email:</label>
                    <input id="inputEmail"  type="email" id="email" placeholder="Digite o email">
                </div>

                <div class="entrada">
                    <label for="senha">Senha:</label>
                    <input id="inputSenha" type="password" id="senha" placeholder="Digite a senha">
                </div>
                
                
                <button class="btnEntrar" onclick="fazerLogin()">Entrar</button>
                <button class="btnCadastrar">Cadastrar Usuário</button>
                
            </form>
            <hr>
        </div>

       <hr>

        <footer><p>Sistema de Login de Usuários &copy; 2026 - Equipe 2 SENAI</p></footer>
    </div>

    
    <script src="/static/login/login.js"></script>
</body>
</html>
